on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVTOOLS_COLOR: always
  FORCE_COLOR: 1

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=custom.github-release-assets depName=actionlint packageName=/^actionlint_.*_linux_amd64\.tar\.gz$/ registryUrl=https://api.github.com/repos/rhysd/actionlint/releases
      ACTIONLINT_VERSION: '1.7.12'
      # renovate-digest: datasource=custom.github-release-assets depName=actionlint currentValue=1.7.12 packageName=/^actionlint_.*_linux_amd64\.tar\.gz$/ registryUrl=https://api.github.com/repos/rhysd/actionlint/releases
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          curl -fsLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256} actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check --strict -
          mkdir -p "actionlint-${ACTIONLINT_VERSION}"
          tar -C "actionlint-${ACTIONLINT_VERSION}" -xf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$(pwd)/actionlint-${ACTIONLINT_VERSION}" >>"$GITHUB_PATH"

      - run: actionlint -verbose -color

  shellcheck:
    strategy:
      fail-fast: false
      matrix:
        package:
          - gnome-shell-extension-ddterm
          - gnome-shell-extension-ddterm-git

    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/archlinux/archlinux:base-devel-20260926.0.600117@sha256:45093891cba1e473e6e656b63bf2a1236d7e1a9de6dc86a9bc10039b06c49e47

    steps:
      - run: pacman -Sy --noconfirm shellcheck git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --replace-all safe.directory "$GITHUB_WORKSPACE"

      - run: echo '::add-matcher::.github/shellcheck-gcc-problem-matcher.json'
      - run: shellcheck --format=gcc "$PACKAGE_NAME/PKGBUILD" "$PACKAGE_NAME"/*.install
        env:
          PACKAGE_NAME: ${{ matrix.package }}

  package:
    strategy:
      fail-fast: false
      matrix:
        package:
          - gnome-shell-extension-ddterm
          - gnome-shell-extension-ddterm-git

    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/archlinux/archlinux:base-devel-20260926.0.600117@sha256:45093891cba1e473e6e656b63bf2a1236d7e1a9de6dc86a9bc10039b06c49e47
      options: --privileged --tmpfs /run

    steps:
    - run: sed -i '/^NoExtract/d' /etc/pacman.conf
    - run: echo "$REPO_CONFIG" >> /etc/pacman.conf
      env:
        REPO_CONFIG: |
          [ddterm]
          SigLevel = Never
          Server = https://ddterm.github.io/aur

    - run: pacman -Sy --noconfirm --noprogressbar --color=always devtools
    - run: systemd-machine-id-setup
    - run: useradd -m builduser
    - run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: git config --global --replace-all safe.directory "$GITHUB_WORKSPACE"
    - run: chown -R builduser .

    - run: sudo -u builduser makepkg --printsrcinfo | tee .SRCINFO
      working-directory: ${{ matrix.package }}

    - run: git diff --exit-code .SRCINFO
      working-directory: ${{ matrix.package }}

    - run: sudo -u builduser makepkg --allsource
      working-directory: ${{ matrix.package }}

    - run: mkarchroot -C /etc/pacman.conf -M /etc/makepkg.conf /var/tmp/root base-devel
    - run: makechrootpkg -r /var/tmp -c -n -C -U builduser -- --holdver
      working-directory: ${{ matrix.package }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.package }}-pkg
        path: |
          ${{ matrix.package }}/*.src.tar.*
          ${{ matrix.package }}/*.pkg.tar.*
          ${{ matrix.package }}/*.log
        if-no-files-found: error
      if: always()

  installed-test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - gnome-shell-extension-ddterm
          - gnome-shell-extension-ddterm-git

    needs: package
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/archlinux/archlinux:base-devel-20260926.0.600117@sha256:45093891cba1e473e6e656b63bf2a1236d7e1a9de6dc86a9bc10039b06c49e47
      options: --privileged --tmpfs /run

    steps:
    - run: |
        # https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
        sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
        sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - run: pacman -Syu --noconfirm git
    - run: systemd-machine-id-setup
    - run: useradd -m builduser

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: installed-test
        persist-credentials: false

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ matrix.package }}-pkg

    - run: rm -v ./*.log
    - run: pacman --noconfirm -U ./*.pkg.tar.*
    - run: tar xf ./*.src.tar.*
    - run: chown -R builduser .
      working-directory: ${{ matrix.package }}
    - run: sudo -u builduser makepkg --noprepare --nobuild --holdver --nodeps
      working-directory: ${{ matrix.package }}
    - id: runtest
      run: >-
        "$GITHUB_WORKSPACE/installed-test/$PACKAGE_NAME.sh"
      working-directory: ${{ matrix.package }}/src
      env:
        PACKAGE_NAME: ${{ matrix.package }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.package }}-test
        path: ${{ steps.runtest.outputs.reports }}
        if-no-files-found: error
      if: always() && steps.runtest.outputs.reports

  repo:
    needs:
      - package
      - installed-test

    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/archlinux/archlinux:base-devel-20260926.0.600117@sha256:45093891cba1e473e6e656b63bf2a1236d7e1a9de6dc86a9bc10039b06c49e47

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: repo
          pattern: '*-pkg'
          merge-multiple: true

      - run: rm ./*.log
        working-directory: repo

      - run: repo-add ddterm.db.tar.zst ./*.pkg.tar.*
        working-directory: repo

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: repo
          pattern: '*-test'
          merge-multiple: false

      - run: pacman -Sy --noconfirm tree

      - run: >-
          find . -type d -exec bash -c
          'tree "$0" -h --du -H "/${GITHUB_REPOSITORY#*/}/${0:2}" -o "$0/index.html"'
          '{}' ';'
        working-directory: repo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
